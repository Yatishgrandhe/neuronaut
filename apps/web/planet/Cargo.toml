[package]
name = "word_planet"
version = "0.1.0"
edition = "2021"
description = "Neuronaut's hero planet: the course's words on a turning sphere, drawn with WebGL2."
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"

[dependencies.web-sys]
version = "0.3"
features = [
  "Window", "Document", "HtmlCanvasElement", "HtmlImageElement", "CanvasRenderingContext2d",
  "WebGl2RenderingContext", "WebGlProgram", "WebGlShader", "WebGlBuffer",
  "WebGlTexture", "WebGlUniformLocation", "WebGlVertexArrayObject",
]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
